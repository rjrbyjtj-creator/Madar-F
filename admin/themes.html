<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تم‌ها و پالت رنگی | پنل مدیریت مدار</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
html{font-size:10px}
:root{
  --bg:#f5f7fb; --surface:#ffffff; --navy:#1c2b4b; --navy-hover:#273b66; --gold:#d4b16a;
  --text:#1e293b; --muted:#64748b; --line:#e3e8f0; --radius:1.2rem;
}
body.dark{--bg:#0f172a;--surface:#1e293b;--navy:#e2e8f0;--text:#f1f5f9;--muted:#94a3b8;--line:#263348}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn',Tahoma,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;font-size:1.1rem}
a{text-decoration:none;color:inherit}button{font-family:inherit;cursor:pointer}
.top{padding:1.4rem 3.2rem;display:flex;align-items:center;gap:1.4rem;border-bottom:1px solid var(--line)}
.back{padding:.7rem 1.4rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.page{max-width:1100px;margin:0 auto;padding:2.4rem 3.2rem 3rem}
h1{font-size:2.2rem;font-weight:800;color:var(--navy);margin-bottom:.4rem}
.sub{color:var(--muted);margin-bottom:2rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.8rem 2rem;margin-bottom:1.6rem}
.card h2{font-size:1.3rem;font-weight:800;color:var(--navy);margin-bottom:1rem}
.palettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:1rem}
.palette{border:2px solid var(--line);border-radius:1rem;padding:1.2rem;background:var(--bg);position:relative}
.palette.active{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.swatches{display:flex;gap:.4rem;margin-bottom:.8rem}
.swatches span{flex:1;height:2.4rem;border-radius:.5rem}
.pname{font-weight:700;margin-bottom:.8rem}
.actions{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{height:3.2rem;padding:0 1.4rem;border-radius:999px;border:0;font-weight:700;font-size:1.05rem}
.btn-act{background:#1c2b4b;color:#fff}
.btn-act:disabled{opacity:.5;cursor:default}
.btn-del{background:transparent;border:1px solid #ef4444;color:#ef4444}
.btn-save{background:#1c2b4b;color:#fff;height:3.6rem;padding:0 2rem;border-radius:999px;border:0;font-weight:700}
.field{margin-bottom:1.2rem}
.field label{display:block;font-weight:600;margin-bottom:.4rem}
.field input,.field select{width:100%;height:3.4rem;padding:0 1.2rem;border-radius:.9rem;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1.1rem}
.colors-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.msg{min-height:1.6rem;color:var(--muted);margin-top:.8rem}
.msg.ok{color:#16a34a}.msg.err{color:#ef4444}
.badge{display:inline-block;padding:.2rem .7rem;border-radius:999px;background:var(--gold);color:#1c2b4b;font-size:.95rem;font-weight:700;margin-right:.5rem}
@media(max-width:700px){.page{padding:1.6rem}.colors-grid{grid-template-columns:1fr}}

body{background:radial-gradient(circle at 8% 0%,color-mix(in srgb,var(--gold) 8%,transparent),transparent 32%),var(--bg)}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);padding:1.5rem max(2rem,calc((100vw - 1120px)/2))}
.page{max-width:1120px;padding:3rem 2.4rem 5rem}
h1{font-size:2.5rem;letter-spacing:-.03em}
.sub{font-size:1.15rem;line-height:1.9}
.card{padding:2rem 2.2rem;border-radius:1.6rem;box-shadow:0 10px 32px rgba(20,35,60,.045);margin-bottom:1.8rem}
.card h2{font-size:1.45rem}
.palettes{grid-template-columns:repeat(auto-fit,minmax(23rem,1fr));gap:1.2rem}
.palette{padding:1.4rem;border-radius:1.2rem;border-width:1px;background:var(--surface);transition:border-color .2s,transform .2s,box-shadow .2s}
.palette:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(20,35,60,.06)}
.palette.active{border:1.5px solid var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 13%,transparent)}
.swatches{height:3.8rem;gap:0;overflow:hidden;border:1px solid var(--line);border-radius:.8rem;margin-bottom:1.1rem}
.swatches span{height:100%;border-radius:0}
.pname{display:flex;align-items:center;gap:.6rem;font-size:1.2rem;margin-bottom:1.1rem}
.actions{align-items:center}
.btn{height:3.5rem;border-radius:.8rem}
.btn-act{background:var(--navy);color:#fff}
.btn-del{border-radius:.8rem}
.btn-save{background:var(--navy);color:#fff;border-radius:.9rem;height:3.8rem}
.field input,.field select{height:3.8rem;border-radius:.9rem}
.field input[type=color]{padding:.35rem;height:4.2rem;cursor:pointer}
.msg{font-size:1.05rem}
.badge{margin:0;border-radius:.5rem;background:color-mix(in srgb,var(--gold) 20%,var(--surface));color:var(--navy)}
@media(max-width:700px){.top{padding:1.3rem 1.6rem}.page{padding:2rem 1.6rem 3rem}.card{padding:1.6rem}}

</style>
</head>
<body>
<div class="top">
  <a class="back" href="./index.html">← داشبورد</a>
  <strong style="font-size:1.3rem;color:var(--navy)">تم‌ها و پالت رنگی</strong>
</div>
<div class="page">
  <h1>مدیریت تم کل سایت</h1>
  <p class="sub">تم فعال روی همه صفحات سایت (فرانت و پنل) اعمال می‌شود.</p>

  <div class="card">
    <h2>تم‌های موجود</h2>
    <div class="palettes" id="list"><p class="msg">در حال بارگذاری…</p></div>
  </div>

  <div class="card">
    <h2>افزودن پالت / تم جدید</h2>
    <div class="field"><label>نام تم</label><input id="name" placeholder="مثلاً آبی مدرسه‌ای" /></div>
    <div class="field"><label>شناسه انگلیسی (اختیاری)</label><input id="slug" placeholder="school-blue" class="ltr" style="direction:ltr" /></div>
    <div class="colors-grid">
      <div class="field"><label>رنگ اصلی (navy)</label><input id="navy" type="color" value="#1c2b4b" /></div>
      <div class="field"><label>رنگ طلایی / تاکید</label><input id="gold" type="color" value="#d4b16a" /></div>
      <div class="field"><label>پس‌زمینه</label><input id="bg" type="color" value="#f5f7fb" /></div>
      <div class="field"><label>سبز / موفقیت</label><input id="green" type="color" value="#22c55e" /></div>
    </div>
    <div class="colors-grid">
      <div class="field"><label>فونت</label>
        <select id="font"><option value="vazir">وزیرمتن</option><option value="tahoma">تاهوما</option><option value="system">سیستم</option></select>
      </div>
      <div class="field"><label>حالت</label>
        <select id="mode"><option value="light">روشن</option><option value="dark">تاریک</option></select>
      </div>
    </div>
    <button class="btn-save" id="createBtn" type="button">ثبت تم جدید</button>
    <div class="msg" id="formMsg"></div>
  </div>
</div>

<script src="./js/admin-guard.js"></script>
<script src="./js/admin-theme.js?v=global-theme-20261114"></script>
<script>
(function () {
  var API = "https://madar-jmy5.onrender.com/api/themes";
  var KEY = "madar_token";

  function token() {
    try { return localStorage.getItem(KEY) || sessionStorage.getItem(KEY); } catch (e) { return null; }
  }
  function headers(json) {
    var h = {};
    if (json) h["Content-Type"] = "application/json";
    var t = token();
    if (t) h.Authorization = "Bearer " + t;
    return h;
  }
  async function api(path, opt) {
    var r = await fetch(API + path, opt);
    var d = {};
    try { d = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(d.message || "خطا");
    return d;
  }

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
    });
  }

  function render(themes) {
    var box = document.getElementById("list");
    if (!themes.length) { box.innerHTML = "<p class='msg'>تمی ثبت نشده.</p>"; return; }
    box.innerHTML = themes.map(function (t) {
      var c = t.colors || {};
      return '<div class="palette' + (t.isActive ? ' active' : '') + '" data-id="' + t.id + '">' +
        '<div class="swatches">' +
        '<span style="background:' + c.navy + '"></span>' +
        '<span style="background:' + c.gold + '"></span>' +
        '<span style="background:' + c.bg + '"></span>' +
        '<span style="background:' + c.green + '"></span>' +
        '</div>' +
        '<div class="pname">' + (t.isActive ? '<span class="badge">فعال</span>' : '') + escapeHtml(t.name) + '</div>' +
        '<div class="actions">' +
        '<button type="button" class="btn btn-act" data-act="' + t.id + '"' + (t.isActive ? ' disabled' : '') + '>' +
        (t.isActive ? 'فعال است' : 'فعال‌سازی') + '</button>' +
        (!t.isDefault ? '<button type="button" class="btn btn-del" data-del="' + t.id + '">حذف</button>' : '') +
        '</div></div>';
    }).join("");
  }

  async function load() {
    try {
      var d = await api("", { headers: headers() });
      render(d.themes || []);
    } catch (e) {
      document.getElementById("list").textContent = e.message || "خطا در بارگذاری";
    }
  }

  document.getElementById("list").addEventListener("click", async function (e) {
    var act = e.target.getAttribute("data-act");
    var del = e.target.getAttribute("data-del");
    try {
      if (act) {
        await api("/" + act + "/activate", { method: "POST", headers: headers() });
        await load();
        if (window.MadarTheme && window.MadarTheme.refresh) await window.MadarTheme.refresh();
      }
      if (del && confirm("این تم حذف شود؟")) {
        await api("/" + del, { method: "DELETE", headers: headers() });
        await load();
      }
    } catch (err) {
      alert(err.message || "خطا");
    }
  });

  document.getElementById("createBtn").onclick = async function () {
    var msg = document.getElementById("formMsg");
    msg.className = "msg";
    msg.textContent = "در حال ثبت…";
    try {
      var body = {
        name: document.getElementById("name").value.trim(),
        slug: document.getElementById("slug").value.trim() || undefined,
        colors: {
          navy: document.getElementById("navy").value,
          gold: document.getElementById("gold").value,
          bg: document.getElementById("bg").value,
          green: document.getElementById("green").value
        },
        font: document.getElementById("font").value,
        mode: document.getElementById("mode").value
      };
      if (!body.name) throw new Error("نام تم را وارد کن.");
      await api("", { method: "POST", headers: headers(true), body: JSON.stringify(body) });
      msg.className = "msg ok";
      msg.textContent = "تم ثبت شد. برای اعمال روی سایت، «فعال‌سازی» را بزن.";
      document.getElementById("name").value = "";
      document.getElementById("slug").value = "";
      await load();
    } catch (e) {
      msg.className = "msg err";
      msg.textContent = e.message || "ثبت نشد";
    }
  };

  load();
})();
</script>
</body>
</html>
