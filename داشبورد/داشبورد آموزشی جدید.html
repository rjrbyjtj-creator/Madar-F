<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>داشبورد مدار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#171818;--panel:#1e2020;--chip:#292b2b;--text:#e3e5e4;--accent:#aab8b0;--sel:#2b302e;--ink:#171a18;--line:#343636}
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden}
body{position:relative;background:var(--bg);color:var(--text);font-family:Vazirmatn,sans-serif}
.logo-well{position:fixed;left:calc((100vw - 252px)/2);top:50%;width:clamp(150px,19vw,220px);aspect-ratio:667/578;transform:translate(-50%,-50%);pointer-events:none;background:var(--bg);-webkit-mask:url("/Madar-F/assets/madar-mark.svg") center/contain no-repeat;mask:url("/Madar-F/assets/madar-mark.svg") center/contain no-repeat;filter:drop-shadow(-2px -2px 3px rgba(255,255,255,.20)) drop-shadow(3px 3px 4px rgba(0,0,0,.95))}
.side{position:fixed;top:14px;right:16px;bottom:14px;width:220px;padding:12px 10px;display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.18);overflow:hidden;z-index:10;isolation:isolate}
.nav-indicator{position:absolute;z-index:0;top:0;right:10px;left:10px;height:30px;border-radius:7px;background:var(--sel);pointer-events:none;opacity:0;transform:translate3d(0,0,0);transition:transform .42s cubic-bezier(.22,1.5,.42,1),height .22s ease,opacity .18s ease;will-change:transform}
.nav-indicator:after{content:"";position:absolute;right:-6px;top:50%;width:3px;height:68%;border-radius:3px;background:var(--accent);transform:translateY(-50%)}
.item{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;flex:1 1 0;min-height:30px;max-height:40px;gap:9px;padding:0 3px 0 6px;border-radius:7px;color:var(--text);text-decoration:none;background:transparent;transition:color .28s ease}
.item .label{font-size:13px;font-weight:500;line-height:1.6;transition:color .3s ease,transform .4s cubic-bezier(.2,.8,.2,1)}
.item .chip{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:7px;background:var(--chip);color:var(--text);transition:background .35s ease,color .35s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.item .chip svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.item.on .label{color:var(--accent);font-weight:700;transform:translateX(-2px)}
.item.on .chip{background:var(--accent);color:var(--ink);transform:scale(1.04)}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item:hover .chip{transform:translateY(-1px)}
.item.on:hover .chip{transform:scale(1.04)}
@media(max-height:560px){.side{padding:8px 10px;gap:2px}.item{height:27px;min-height:27px;max-height:27px;flex:none}.item .chip{width:23px;height:23px}.item .chip svg{width:15px;height:15px}}
@media(max-width:520px){.side{right:10px;left:10px;width:auto}.logo-well{left:50%;opacity:.45}}
@media(prefers-reduced-motion:reduce){.nav-indicator,.item,.item .chip,.item .label{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="nav-home" viewBox="0 0 28 28"><path d="M10.87 4.09Q14 1.81 17.13 4.09L23.59 8.78Q26.72 11.05 25.52 14.74L23.06 22.32Q21.86 26.01 17.99 26.01L10.01 26.01Q6.14 26.01 4.94 22.32L2.48 14.74Q1.28 11.05 4.41 8.78Z"/><path d="M9.5 26.19V21.66A4.47 4.47 0 0 1 18.44 21.66V26.19"/></symbol>

<symbol id="nav-advice" viewBox="0 0 28 28"><path d="M4.62 11.6Q1.22 10 4.68 8.55L12.87 5.1Q13.85 4.69 14.83 5.09L23.26 8.57Q26.72 10 23.32 11.57L14.81 15.49Q13.85 15.94 12.89 15.49Z"/><path d="M6.35 12.88V19.56Q6.35 23 10.29 23H17.47Q21.6 23 21.6 19.56V12.88M2.91 11.31V17.88"/></symbol>
<symbol id="nav-video" viewBox="0 0 28 28"><rect x="3.5" y="5.5" width="21" height="17" rx="5"/><path d="M12 10.5v7l5.8-3.5L12 10.5Z"/></symbol>
<symbol id="nav-quiz" viewBox="0 0 28 28"><circle cx="14" cy="14" r="10.5"/><path d="M11 11.3c.3-1.9 1.6-3 3.2-3 1.9 0 3.2 1.2 3.2 2.9 0 1.2-.7 1.9-1.6 2.5-.9.6-1.3 1.1-1.3 2.1M14.2 19.9h.01"/></symbol>
<symbol id="nav-pin" viewBox="0 0 28 28"><path d="M14 25c-4.4-4-8-8-8-12.2C6 8.1 9.4 4 14 4s8 4.1 8 8.8c0 4.2-3.6 8.2-8 12.2Z"/><circle cx="14" cy="12.5" r="3.2"/></symbol>
<symbol id="nav-chart" viewBox="0 0 28 28"><rect x="3.8" y="14" width="5.2" height="10" rx="2"/><rect x="11.4" y="4" width="5.2" height="20" rx="2"/><rect x="19" y="9.5" width="5.2" height="14.5" rx="2"/><path d="M14 9v3.5"/></symbol>
<symbol id="nav-timer" viewBox="0 0 28 28"><circle cx="14" cy="15.2" r="9.5"/><path d="M14 10.2v5.3l3.2 2M11 2.8h6M14 2.8v3"/></symbol>
<symbol id="nav-book" viewBox="0 0 28 28"><path d="M14 6.5c-1.8-1.6-4.6-2.4-8.7-2.2-.8 0-1.3.6-1.3 1.4v13.7c0 .9.7 1.5 1.5 1.5 3.8-.1 6.4.6 8.5 2.3M14 6.5c1.8-1.6 4.6-2.4 8.7-2.2.8 0 1.3.6 1.3 1.4v13.7c0 .9-.7 1.5-1.5 1.5-3.8-.1-6.4.6-8.5 2.3M14 6.5v16.7M7.5 9.5H11M7.5 13H11"/></symbol>
<symbol id="nav-target" viewBox="0 0 28 28"><circle cx="13" cy="15" r="10"/><circle cx="13" cy="15" r="5.6"/><circle cx="13" cy="15" r="1.2" fill="currentColor"/><path d="M13 15l9.5-9.5M22.5 5.5l.3-2.7M22.5 5.5l2.7-.3"/></symbol>
<symbol id="s-calp" viewBox="0 0 28 28"><rect x="4.38" y="5.25" width="19.25" height="19.81" rx="3.25" fill="currentColor" stroke="none"/><rect x="9.06" y="1.88" width="3" height="6.31" rx="1.5" fill="#242427" stroke="none"/><rect x="15.75" y="1.88" width="3.12" height="6.31" rx="1.56" fill="#242427" stroke="none"/><rect x="9.56" y="2.38" width="2" height="5.31" rx="1" fill="currentColor" stroke="none"/><rect x="16.25" y="2.38" width="2.12" height="5.31" rx="1.06" fill="currentColor" stroke="none"/><path d="M3.88 11.56H24.12M10.62 16.44H17.12" stroke="#242427" stroke-width="1.1"/><circle cx="21.62" cy="22.75" r="4.25" stroke="#242427" stroke-width="1.15"/></symbol>
<symbol id="nav-star" viewBox="0 0 28 28"><path d="M14 3.6c.4 0 .8.2 1 .7L17.1 8.5L21.7 9.2c1.7.3 2.3 2.2 1.1 3.4L19.5 15.8L20.3 20.3c.3 1.7-1.5 3-3 2.2L14 20.4L10.7 22.5c-1.5.8-3.3-.5-3-2.2L8.5 15.8L5.2 12.6c-1.2-1.2-.6-3.1 1.1-3.4L10.9 8.5L13 4.3c.2-.5.6-.7 1-.7Z"/></symbol>
<symbol id="nav-task" viewBox="0 0 28 28"><path d="M9.5 5.5H8c-3 0-4.5 1.6-4.5 4.8v9c0 3.4 1.6 5 4.8 5h11.4c3.2 0 4.8-1.6 4.8-5v-9c0-3.2-1.5-4.8-4.5-4.8h-1.5"/><rect x="9.5" y="2.8" width="9" height="5.4" rx="2.2"/><path d="M9 14.5h10M9 19h6"/></symbol>
<symbol id="nav-mail" viewBox="0 0 28 28"><rect x="3.5" y="5.5" width="21" height="17" rx="5"/><path d="M6.5 10l5.6 4.2c1.1.8 2.7.8 3.8 0L21.5 10"/></symbol>
</defs></svg>
<div class="logo-well" aria-hidden="true"></div>
<nav class="side" aria-label="ناوبری داشبورد">
<span class="nav-indicator" aria-hidden="true"></span>
</nav>
<script>
const NAV=[['صفحه شخصی','','nav-home'],['پیام‌ها','messages','nav-chat'],['مشاوره','advice','nav-advice'],['کلاس‌ها','classes','nav-video'],['آزمون‌ها','tests','nav-quiz'],['آزمون حضوری','onsite','nav-pin'],['گزارش روزانه','report','nav-chart'],['سابقه','history','nav-timer'],['نمرات امتحانی','exams','nav-book'],['ترازهای ماز','ranks','nav-target'],['تقویم برنامه‌ها','calendar','s-calp'],['ستاره‌ها','stars','nav-star'],['تکلیف','task','nav-task'],['ارتباط با پشتیبانی','support','nav-mail']];
const side=document.querySelector('.side');
const indicator=document.querySelector('.nav-indicator');
const nav=NAV.map(([label,route,icon])=>'<a class="item" data-route="'+route+'" href="#/'+route+'"><span class="label">'+label+'</span><span class="chip"><svg viewBox="0 0 28 28" aria-hidden="true"><use href="#'+icon+'"></use></svg></span></a>').join('');
side.insertAdjacentHTML('beforeend',nav);
function renderNavigation(){
 const hash=location.hash;
 const route=hash.startsWith('#/')?hash.slice(2):'';
 side.querySelectorAll('.item').forEach(item=>item.classList.toggle('on',item.dataset.route===route));
 const active=side.querySelector('.item.on');
 if(!active)return;
 const sideRect=side.getBoundingClientRect();
 const activeRect=active.getBoundingClientRect();
 indicator.style.height=activeRect.height+'px';
 indicator.style.transform='translate3d(0,'+(activeRect.top-sideRect.top-side.clientTop)+'px,0)';
 indicator.style.opacity='1';
}
addEventListener('hashchange',renderNavigation);
addEventListener('resize',renderNavigation);
renderNavigation();
</script>
</body>
</html>
