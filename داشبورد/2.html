<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پاسخ‌نامه‌ی آزمون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#101216;--panel:#14161b;--field:#1b1e25;--hdr:#13151a;--border:rgba(255,255,255,.07);--text:#d8dbe2;--muted:#7f8696;--acc:#6aa3f5;--ok:#5fcf8f;--bad:#cf7b74;--sh:rgba(0,0,0,.25);color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#eceef1;--panel:#f4f5f7;--field:#e4e7ec;--hdr:#f4f5f7;--border:rgba(30,40,60,.1);--text:#2a2f38;--muted:#6a7280;--acc:#3d6bc4;--ok:#17784a;--bad:#b5524b;--sh:rgba(30,40,60,.1);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--bg);scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 50%,transparent) var(--bg)}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.7;font-size:13px;overflow-x:hidden;
background-image:radial-gradient(900px 500px at 90% 0,color-mix(in srgb,var(--acc) 7%,transparent),transparent);background-repeat:no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:30}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);border-bottom:1px solid var(--border)}
.in{max-width:1760px;margin:0 auto;padding:10px 12px;display:flex;align-items:center;gap:18px}
.brand{display:flex;flex-direction:column;line-height:1.35}
.brand b{font-size:16px;font-weight:800}
.brand small{font-size:11.5px;color:var(--muted)}
.nums{display:flex;align-items:stretch;margin-inline-start:auto}
.nums div{display:flex;flex-direction:column;align-items:center;padding:0 16px;border-inline-start:1px solid var(--border);line-height:1.3}
.nums div:first-child{border-inline-start:0}
.nums b{font-size:17px;font-weight:700}
.nums span{font-size:11px;color:var(--muted)}
.nums .g b{color:var(--ok)}.nums .r b{color:var(--bad)}.nums div:last-child b{color:var(--acc)}
.tools{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:7px;font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:color .2s,border-color .2s}
.btn:hover{color:var(--text);border-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.btn.icon{width:34px;padding:0}
.btn.warn.arm{color:var(--bad);border-color:var(--bad)}
#themeBtn .sun{display:none}:root[data-theme="light"] #themeBtn .sun{display:block}:root[data-theme="light"] #themeBtn .moon{display:none}
.line{position:absolute;inset:auto 0 -1px 0;height:2px;background:transparent}
.line i{display:block;height:100%;width:0;background:var(--acc);transition:width .5s ease}

.wrap{max-width:1760px;margin:0 auto;padding:12px 8px 24px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:start}
.col{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:4px 6px}
.sh{display:flex;align-items:baseline;justify-content:space-between;padding:8px 6px;border-bottom:1px solid var(--border);margin-bottom:2px}
.sh h2{font-size:13px;font-weight:700}
.sh small{color:var(--muted);font-size:11.5px}

.qr{display:grid;grid-template-columns:34px auto 1fr;align-items:center;gap:6px;padding:0 4px;height:40px;border-bottom:1px solid var(--border);border-radius:6px;transition:background-color .15s}
.qr:hover{background:color-mix(in srgb,var(--field) 55%,transparent)}
.qr:nth-child(5n+1){border-bottom-color:color-mix(in srgb,var(--muted) 35%,transparent)}
.qr:last-child{border-bottom-color:transparent}
.qn{font-size:12px;font-weight:500;color:var(--muted);text-align:center}
.opts{display:flex;gap:4px}
.o{width:29px;height:29px;border-radius:6px;border:1px solid var(--border);background:var(--field);color:var(--text);font:inherit;font-size:12.5px;cursor:pointer;display:grid;place-items:center;transition:border-color .2s,background-color .2s}
.o:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--border))}
.o:active{transform:scale(.94)}
.o.ok{background:color-mix(in srgb,var(--ok) 22%,var(--field));border-color:var(--ok);color:var(--ok);font-weight:700}
.o.no{background:color-mix(in srgb,var(--bad) 22%,var(--field));border-color:var(--bad);color:var(--bad);font-weight:700}
.st{height:30px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;line-height:1.2;font-weight:700;color:var(--muted);border:1px solid transparent}
.st small{font-size:10.5px;font-weight:500}
.st.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 32%,transparent)}
.st.no{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 32%,transparent)}

@media (max-width:1199px){.grid{grid-template-columns:1fr 1fr}.in{flex-wrap:wrap;gap:10px 14px}}
@media (max-width:700px){.grid{grid-template-columns:1fr;gap:8px}.nums{order:3;flex-basis:100%;margin:0;justify-content:space-between}.nums div{flex:1;padding:0 6px}.tools{margin-inline-start:auto}.btn.warn span{display:none}.btn.warn{width:34px;padding:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <div class="brand"><b>پاسخ‌نامه</b><small id="range"></small></div>
    <div class="nums" aria-live="polite">
      <div class="g"><b id="vOk">۰</b><span>درست</span></div>
      <div class="r"><b id="vNo">۰</b><span>نادرست</span></div>
      <div><b id="vLeft">۰</b><span>مانده</span></div>
      <div><b id="vPct">۰٪</b><span>دقت</span></div>
    </div>
    <div class="tools">
      <button class="btn warn" id="reset" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8M3 3v5h5"/></svg><span>پاک کردن</span></button>
      <button class="btn icon" id="themeBtn" type="button" aria-label="تغییر تم روشن و تیره">
        <svg class="i moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        <svg class="i sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
  <div class="line"><i id="bar"></i></div>
</header>
<div class="wrap"><main class="grid" id="grid"></main></div>
<script>
const A="3214134423"+"4112114343"+"3414134143"+"3312214114"+"3122212343"+"2432434224"+"3311131411"+"3423234411"+"1134244243"+"4131321432"
+"3131323234"+"2112224132"+"2221214422"+"1344332114"+"2424422142"+"2132311423"+"3121111124"+"1231121211"+"3424113313"+"1132332233"
+"2432413231"+"1141242234"+"4232333132"+"4144433213"+"3244223422"+"2212323322"+"2134313213"+"1314442223"+"2331223433"+"1432121122"
+"2422112443"+"3322143432"+"4432332432"+"3234323324"+"3224422414"+"2221242132"+"3441413343"+"2133434133"+"2132333122"+"1143114332"
+"2321333213"+"1234422443"+"1313142321"+"2223233423"+"4334332242"+"3222432132"+"4113344233"+"4313231443"+"4112431433"+"3243134322";
const START=2046,N=A.length,COLS=4,PER=Math.ceil(N/COLS),KEY="answer-sheet-2046";
const fa=n=>Number(n).toLocaleString("fa-IR",{useGrouping:false});
const $=id=>document.getElementById(id);
let sel={};
try{sel=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){sel={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(sel))}catch(e){}};
$("range").textContent=`سؤال ${fa(START)} تا ${fa(START+N-1)}`;

let html="";
for(let c=0;c<COLS;c++){
  const from=START+c*PER,to=Math.min(START+N-1,from+PER-1);
  html+=`<section class="col"><div class="sh"><h2>${fa(from)} تا ${fa(to)}</h2><small>${fa(to-from+1)} سؤال</small></div>`;
  for(let q=from;q<=to;q++){
    html+=`<div class="qr" data-q="${q}"><b class="qn">${fa(q)}</b><div class="opts" role="radiogroup" aria-label="سؤال ${fa(q)}">`
      +[1,2,3,4].map(o=>`<button type="button" class="o" data-o="${o}" aria-pressed="false" aria-label="گزینه ${fa(o)}">${fa(o)}</button>`).join("")
      +`</div><div class="st" role="status"><span>—</span></div></div>`;
  }
  html+=`</section>`;
}
$("grid").innerHTML=html;

function paint(row){
  const q=+row.dataset.q,s=sel[q],right=+A[q-START],st=row.querySelector(".st");
  row.querySelectorAll(".o").forEach(b=>{
    const on=s&&+b.dataset.o===s;
    b.classList.toggle("ok",!!on&&s===right);
    b.classList.toggle("no",!!on&&s!==right);
    b.setAttribute("aria-pressed",on?"true":"false");
  });
  st.className="st"+(s?(s===right?" ok":" no"):"");
  st.innerHTML=!s?"<span>—</span>":s===right?"<span>✓ درست</span>":`<span>✕ نادرست</span><small>پاسخ: ${fa(right)}</small>`;
}
function stats(){
  let ok=0,no=0;
  for(const q in sel){sel[q]===+A[q-START]?ok++:no++}
  const n=ok+no;
  $("vOk").textContent=fa(ok);$("vNo").textContent=fa(no);$("vLeft").textContent=fa(N-n);
  $("vPct").textContent=fa(n?Math.round(ok/n*100):0)+"٪";
  $("bar").style.width=(n/N*100)+"%";
}
const rows=[...document.querySelectorAll(".qr")];
rows.forEach(paint);stats();

$("grid").addEventListener("click",e=>{
  const b=e.target.closest(".o");if(!b)return;
  const row=b.closest(".qr"),q=+row.dataset.q,o=+b.dataset.o;
  if(sel[q]===o)delete sel[q];else sel[q]=o;
  paint(row);stats();save();
});

const rb=$("reset"),rl=rb.querySelector("span");let rt;
rb.addEventListener("click",()=>{
  if(rb.classList.contains("arm")){
    sel={};save();rows.forEach(paint);stats();
    rb.classList.remove("arm");rl.textContent="پاک کردن";clearTimeout(rt);
  }else{
    rb.classList.add("arm");rl.textContent="مطمئنی؟";
    rt=setTimeout(()=>{rb.classList.remove("arm");rl.textContent="پاک کردن"},3500);
  }
});

const root=document.documentElement,TK="answer-sheet-theme";
try{const t=localStorage.getItem(TK);if(t==="light"||t==="dark")root.dataset.theme=t}catch(e){}
$("themeBtn").addEventListener("click",()=>{
  const t=root.dataset.theme==="light"?"dark":"light";root.dataset.theme=t;
  try{localStorage.setItem(TK,t)}catch(e){}
});
</script>
</body>
</html>
