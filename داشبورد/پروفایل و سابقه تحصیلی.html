<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پروفایل و سابقه تحصیلی | مدار</title>
<link rel="icon" type="image/png" href="../عکس ها/تب.png">
<link rel="apple-touch-icon" href="../عکس ها/تب.png">
<meta name="description" content="پروفایل و سابقه تحصیلی مدار؛ نمرات، تراز آزمون‌ها، وضعیت روزانه و عملکرد هر درس.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f6f7fc;--card:#fff;--navy:#14234f;--navy-soft:#3b4a72;--muted:#6f778c;--line:#e9ecf4;--gold:#b98a2e;--gold-soft:#e6cd96;
    --blue-bg:#e9f0fd;--blue-ink:#2a4a8d;--peach-bg:#fcf0db;--peach-ink:#8c5d17;--green-bg:#e6f3e9;--green-ink:#26683d;--red:#c44d4d;
    --ease:cubic-bezier(.2,.7,.2,1);--font:"Vazirmatn","Vazir","IRANSans",Tahoma,system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:var(--font);font-size:12px;color:var(--navy);background:var(--bg);line-height:1.7;overflow-x:hidden}
  a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
  .wrap{width:100%;max-width:1040px;margin-inline:auto;padding-inline:clamp(14px,3vw,28px)}
  .icon{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  @keyframes ring{from{transform:scale(1);opacity:.55}to{transform:scale(3.4);opacity:0}}
  .reveal{animation:rise .7s var(--ease) backwards;animation-delay:var(--d,0s)}
  .ph:empty{display:grid;place-items:center;border:1.5px dashed var(--gold-soft);border-radius:6px;background:rgba(185,138,46,.04)}
  .ph:empty::before{content:attr(data-ph);color:var(--gold);font-size:9px}

  .page-crumb{display:flex;align-items:center;gap:8px;padding-top:18px;padding-bottom:4px;color:var(--muted);font-size:11px}
  .page-crumb a:hover{color:var(--gold)}.page-crumb .sep{color:var(--gold);opacity:.8}
  .page-crumb strong{color:var(--navy);font-weight:600}

  /* ───────── هیرو ───────── */
  .hero{padding:6px 0 14px}
  .hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) 210px;align-items:center;gap:16px}
  .hero h1{margin:0;font-size:clamp(20px,2.4vw,24px);font-weight:800;line-height:1.35}
  .hero p{margin:4px 0 0;max-width:300px;font-size:11.5px;line-height:1.9;color:var(--muted)}
  .goal{margin-top:10px;display:inline-flex;align-items:center;gap:7px;padding:3px 10px;background:var(--card);border:1px solid var(--gold-soft);border-radius:7px;font-size:11px;font-weight:500}
  .goal i{position:relative;width:5px;height:5px;border-radius:50%;background:var(--gold);flex:none}
  .goal i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--gold);animation:ring 2.4s ease-out infinite}

  /* جای تصاویر: وقتی فایل نبود کادر خط‌چین نشان داده می‌شود */
  .art{display:grid;place-items:center}
  .art img{width:100%;height:100%;object-fit:contain;display:block}
  .is-empty{border:1.5px dashed var(--gold-soft);border-radius:10px;background:rgba(185,138,46,.04)}
  .is-empty img{display:none}
  .is-empty::after{content:attr(data-label);padding:4px;text-align:center;font-size:10.5px;line-height:1.5;color:var(--gold)}
  .art-hero{aspect-ratio:3/2}.art-sm{width:96px;aspect-ratio:1}

  /* ───────── کارت‌ها ───────── */
  .card{background:var(--card);border-radius:14px;padding:14px 18px 16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(20,35,79,.04)}
  .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
  .sh h2{position:relative;margin:0;padding-bottom:5px;font-size:13.5px;font-weight:700}
  .sh h2::after{content:"";position:absolute;inset-inline:0;bottom:0;height:2px;border-radius:2px;background:var(--gold)}
  .lnk{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 9px;border:1px solid var(--gold-soft);border-radius:7px;background:var(--card);font-size:11px;font-weight:500;color:var(--gold);transition:background .2s}
  .lnk:hover{background:rgba(185,138,46,.08)}.lnk .icon{width:11px;height:11px;stroke-width:2}
  .tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border:1px solid var(--line);border-radius:7px;font-size:11px;color:var(--muted)}
  .split{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:18px;align-items:center}

  /* ───────── نمرات: ردیف‌به‌ردیف ───────── */
  .gl{border:1px solid var(--line);border-radius:10px;padding:2px 10px 8px}
  .gr{display:grid;grid-template-columns:minmax(0,1fr) 92px 64px 54px;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid var(--line);font-size:12px;min-height:34px}
  .gr.hd{min-height:26px;font-size:10.5px;color:var(--muted);font-weight:500}
  .gr .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gr .sc{font-weight:700;font-size:13px}
  .gr .ac{display:flex;justify-content:flex-end;gap:4px}
  .chip{display:inline-block;width:fit-content;padding:0 9px;border-radius:6px;font-size:10.5px;font-weight:600;line-height:1.8}
  .blue{background:var(--blue-bg);color:var(--blue-ink)}.peach{background:var(--peach-bg);color:var(--peach-ink)}.green{background:var(--green-bg);color:var(--green-ink)}
  .ib{display:grid;place-items:center;width:24px;height:24px;border:1px solid transparent;border-radius:7px;background:none;color:var(--muted);transition:.2s}
  .gr .ib.del{opacity:0}.gr:hover .ib.del,.gr .ib.del:focus-visible{opacity:1}
  @media(hover:none){.gr .ib.del{opacity:1}}
  .ib.del:hover{color:var(--red);background:rgba(196,77,77,.08)}
  .ib.ok{background:var(--navy);color:var(--gold-soft)}.ib.ok:hover{opacity:.88}
  .ib.no{border-color:var(--line)}.ib.no:hover{color:var(--red);border-color:var(--red)}
  .ed input,.ed select{width:100%;height:28px;min-width:0;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--navy);font:inherit;font-size:12px;outline:none;transition:border-color .2s}
  .ed input:focus,.ed select:focus{border-color:var(--gold)}.ed input::placeholder{color:var(--muted)}
  .ed .bad{border-color:var(--red)}
  .gr.ed{border-bottom-style:dashed}
  .add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:30px;margin-top:8px;border:1.5px dashed var(--gold-soft);border-radius:8px;background:none;font-size:11.5px;font-weight:500;color:var(--gold);transition:background .2s,border-color .2s}
  .add:hover{background:rgba(185,138,46,.07);border-color:var(--gold)}
  .emp{padding:12px;text-align:center;color:var(--muted);font-size:11px}

  /* تراز */
  .lv{display:grid;grid-template-columns:130px minmax(0,1fr) 96px;gap:18px;align-items:center}
  .stats{display:grid;gap:8px}
  .stat{padding:8px 12px;border:1px solid var(--line);border-radius:10px}
  .stat small{display:block;font-size:10.5px;color:var(--muted);line-height:1.5}
  .stat b{display:block;font-size:20px;font-weight:800;line-height:1.3}
  .legend{display:flex;gap:12px;font-size:10.5px;color:var(--muted)}
  .legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:5px}
  svg.chart{width:100%;height:auto;display:block;direction:ltr}
  .chart .g{stroke:var(--line)}.chart .t{fill:var(--muted);font:9.5px var(--font)}

  /* یادداشت‌ها */
  .nt{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 96px;gap:14px;align-items:stretch}
  .nl{display:grid;gap:6px;align-content:start;min-width:0}
  .ni{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;font-size:11.5px}
  .ni .d{width:5px;height:5px;border-radius:50%;background:var(--gold);flex:none}
  .ni time{color:var(--muted);font-size:10.5px;white-space:nowrap}
  .ni p{margin:0;flex:1;min-width:0;color:var(--navy-soft)}
  .cp{position:relative}
  .cp textarea{width:100%;height:100%;min-height:92px;resize:none;padding:8px 10px 36px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--navy);font:inherit;font-size:11.5px;outline:none}
  .cp textarea:focus{border-color:var(--gold)}.cp textarea::placeholder{color:var(--muted)}
  .send{position:absolute;left:8px;bottom:8px;display:grid;place-items:center;width:24px;height:24px;border:0;border-radius:7px;background:var(--navy);color:var(--gold-soft)}
  .send:hover{opacity:.88}

  /* کاشی‌ها */
  .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .tile{padding:8px 11px;border:1px solid var(--line);border-radius:10px;transition:border-color .25s}
  .tile:hover{border-color:var(--gold-soft)}
  .tile .r{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;font-weight:600}
  .tile .r span{font-size:10.5px;font-weight:500;color:var(--gold)}
  .bar{height:3px;margin-top:7px;border-radius:3px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:var(--gold)}
  .sv{display:flex;align-items:center;gap:9px}
  .sv .ic{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--bg);color:var(--navy-soft);flex:none}
  .sv small{display:block;font-size:10.5px;color:var(--muted);line-height:1.5}
  .sv b{display:block;font-size:16px;font-weight:800;line-height:1.4}

  /* آزمون‌ها */
  .ul{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .ei{display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:12px;font-weight:500}
  .ei+.ei{border-top:1px solid var(--line)}
  .lg{width:32px;height:24px;flex:none}.lg img{width:100%;height:100%;object-fit:contain;display:block}.lg:empty::before{font-size:8px}
  .pill{margin-inline-start:auto;padding:0 10px;border-radius:7px;background:var(--blue-bg);color:var(--blue-ink);font-size:11px;font-weight:600;white-space:nowrap}

  @media(max-width:900px){.lv,.nt{grid-template-columns:1fr}.lv .art-sm,.nt .art-sm{display:none}.stats{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:700px){.hero .wrap{grid-template-columns:1fr}.art-hero{max-width:200px;margin-inline:auto;order:-1}.split{grid-template-columns:1fr}.split .art-sm{display:none}}
  @media(max-width:480px){.card{padding:12px}.gr{grid-template-columns:minmax(0,1fr) 78px 52px 50px;gap:6px}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* هماهنگی با تم تیره سایت */
  html[data-theme="dark"]{color-scheme:dark;--bg:#0f172a!important;--card:#172238!important;--navy:#e7edf6!important;--navy-soft:#b5c2d8!important;--muted:#9aa7bc!important;--line:#2a3850!important;--gold:#d6ad62!important;--gold-soft:#725b35!important;--blue-bg:#1d3150!important;--blue-ink:#c5d8ff!important;--peach-bg:#3b3022!important;--peach-ink:#f2d3a0!important;--green-bg:#1e3a30!important;--green-ink:#b9e7c6!important;--red:#e07a7a!important}
  html[data-theme="dark"] body{background:var(--bg)!important;color:var(--navy)!important}

  html.embedded,html.embedded body{background:transparent!important}
  html.embedded .page-crumb,html.embedded .hero{display:none!important}
  html.embedded body{padding-top:0;overflow-y:hidden}
  html.embedded .wrap{max-width:1040px}

  /* Embedded profile: match the width, scale and rhythm of the planning sections */
  html.embedded body { font-size: 14px; }
  html.embedded .wrap { width: 100%; max-width: none; padding-inline: 0; }
  html.embedded .card { padding: 20px 24px 22px; margin-bottom: 18px; border-radius: 16px; }
  html.embedded .sh { gap: 14px; margin-bottom: 16px; }
  html.embedded .sh h2 { font-size: 17px; padding-bottom: 7px; }
  html.embedded .lnk, html.embedded .tag { height: 30px; font-size: 12px; padding-inline: 12px; }
  html.embedded .split { grid-template-columns: minmax(0,1fr) 140px; gap: 24px; }
  html.embedded .art-sm { width: 140px; }
  html.embedded .gl { padding: 5px 14px 10px; }
  html.embedded .gr { grid-template-columns: minmax(0,1fr) 110px 76px 60px; gap: 10px; min-height: 42px; padding: 7px 4px; font-size: 13px; }
  html.embedded .gr.hd { min-height: 32px; font-size: 11.5px; }
  html.embedded .gr .sc { font-size: 15px; }
  html.embedded .chip { font-size: 11.5px; padding-inline: 10px; }
  html.embedded .ib { width: 28px; height: 28px; }
  html.embedded .add { height: 36px; font-size: 12.5px; }
  html.embedded .lv { grid-template-columns: 150px minmax(0,1fr) 140px; gap: 22px; }
  html.embedded .stat { padding: 10px 14px; }
  html.embedded .stat small { font-size: 12px; }
  html.embedded .stat b { font-size: 23px; }
  html.embedded .legend { font-size: 12px; gap: 16px; }
  html.embedded .nt { grid-template-columns: minmax(0,1.3fr) minmax(0,1fr) 140px; gap: 18px; }
  html.embedded .ni { gap: 10px; padding: 8px 12px; font-size: 13px; }
  html.embedded .ni time, html.embedded .tile .r span { font-size: 11.5px; }
  html.embedded .cp textarea { min-height: 112px; font-size: 13px; }
  html.embedded .g4 { gap: 12px; }
  html.embedded .tile { padding: 11px 14px; }
  html.embedded .tile .r { font-size: 13px; }
  html.embedded .sv .ic { width: 32px; height: 32px; }
  html.embedded .sv small { font-size: 12px; }
  html.embedded .sv b { font-size: 18px; }
  html.embedded .ei { gap: 12px; padding: 9px 14px; font-size: 13px; }
  html.embedded .lg { width: 40px; height: 30px; }
  html.embedded .pill { font-size: 12px; padding: 2px 12px; }
  @media(max-width:900px) {
    html.embedded .lv, html.embedded .nt { grid-template-columns: 1fr; }
    html.embedded .lv .art-sm, html.embedded .nt .art-sm { display: none; }
    html.embedded .stats { grid-template-columns: 1fr 1fr; }
  }
  @media(max-width:700px) {
    html.embedded .card { padding: 16px; }
    html.embedded .split { grid-template-columns: 1fr; }
    html.embedded .split .art-sm { display: none; }
    html.embedded .g4 { grid-template-columns: repeat(2,minmax(0,1fr)); }
  }
  @media(max-width:480px) {
    html.embedded .gr { grid-template-columns: minmax(0,1fr) 78px 52px 50px; gap: 6px; }
  }



  .inline-history-editor{margin-top:12px;padding:14px;border:1px solid var(--gold-soft);border-radius:12px;background:var(--card)}
  .inline-editor-head,.inline-editor-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .inline-editor-head{margin-bottom:10px;color:var(--navy);font-size:13px}
  .inline-editor-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
  .inline-field{display:grid;gap:5px;min-width:0;color:var(--muted);font-size:11px}
  .inline-field input,.inline-field select,.inline-field textarea{width:100%;min-width:0;min-height:36px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--navy);font:inherit;font-size:12px;outline:none}
  .inline-field textarea{min-height:54px;resize:vertical}
  .inline-field input:focus,.inline-field select:focus,.inline-field textarea:focus{border-color:var(--gold)}
  .inline-editor-actions{justify-content:flex-start;margin-top:10px}
  .inline-save,.inline-cancel{min-height:32px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--navy);font:inherit;font-size:11px;cursor:pointer}
  .inline-save{border-color:var(--navy);background:var(--navy);color:#fff}

  .jalali-date{position:relative;min-width:0}
  .jalali-date-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:36px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--navy);font:inherit;font-size:12px;text-align:right}
  .jalali-date-trigger:after{content:"";width:7px;height:7px;border-left:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);transform:rotate(-45deg);margin-top:-4px;flex:none}
  .jalali-picker{position:absolute;z-index:50;top:calc(100% + 7px);right:0;width:min(292px,calc(100vw - 48px));padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--card);box-shadow:0 14px 38px rgba(15,23,42,.2);direction:rtl}
  .jalali-picker[hidden]{display:none!important}
  .jalali-picker-head{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 30px;gap:5px;align-items:center;margin-bottom:10px}
  .jalali-picker-head select{width:100%;height:30px;min-width:0;padding:0 5px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--navy);font:inherit;font-size:11px}
  .jalali-nav{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--navy);font-size:17px;line-height:1}
  .jalali-week,.jalali-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
  .jalali-week{margin-bottom:5px;color:var(--muted);font-size:10px}
  .jalali-day{height:30px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--navy);font:inherit;font-size:11px}
  .jalali-day:hover{border-color:var(--gold-soft);background:rgba(185,138,46,.08)}
  .jalali-day.is-today{border-color:var(--gold);color:var(--gold);font-weight:800}
  .jalali-day.is-selected{background:var(--navy);color:#fff;border-color:var(--navy)}
  .jalali-day:disabled{visibility:hidden}
  .jalali-picker-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
  .jalali-picker-foot button{border:0;background:none;color:var(--gold);font:inherit;font-size:11px}
  html[data-theme="dark"] .jalali-picker{box-shadow:0 14px 38px rgba(0,0,0,.45)}

  [data-add][hidden]{display:none!important}
  @media(max-width:520px){.inline-editor-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.inline-field:has(textarea){grid-column:1/-1}}

</style>

<main>
  <section class="hero">
    <div class="wrap">
      <div>
        <h1 class="reveal" style="--d:.1s">پروفایل و سابقه تحصیلی من</h1>
        <p class="reveal" style="--d:.2s">مدیریت کامل عملکرد و پیشرفت تحصیلی شما<br>نمرات، تراز و پیشرفت هر درس در یک نگاه.</p>
        <div class="goal reveal" style="--d:.3s"><i></i><span id="avgGoal"></span></div>
      </div>
      <!-- 👉 تصویر هیرو (تقویم + کلیپ‌بورد + کتاب‌ها): ../عکس ها/پروفایل هیرو.png — PNG شفاف، حدود ۶۰۰×۴۰۰ -->
      <div class="art art-hero reveal" style="--d:.25s" data-label="تصویر بالای صفحه">
        <img src="../عکس ها/پروفایل هیرو.png" alt="" onerror="this.parentNode.classList.add('is-empty')">
      </div>
    </div>
  </section>

  <div class="wrap" id="app"></div>
</main>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/madar-connect.js?v=academic-history-api-20261118"></script>
<div id="historyStatus" role="status" aria-live="polite" style="max-width:1040px;margin:0 auto 12px;padding:0 16px;color:var(--muted);font-size:12px"></div>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const app = $('app');
  const status = $('historyStatus');
  const fa = v => String(v ?? '').replace(/\\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const todayISO = () => { const d=new Date(); return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'); };
  const dateFa = value => { if(!value)return '—'; const [y,m,d]=value.split('-').map(Number); return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{day:'numeric',month:'short',year:'numeric'}).format(new Date(y,m-1,d,12)); };

  const jalaliFmt=new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'});
  const jalaliMonths=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  const jalaliWeek=['ش','ی','د','س','چ','پ','ج'];
  const jalaliParts=date=>Object.fromEntries(jalaliFmt.formatToParts(date).filter(p=>p.type!=='literal').map(p=>[p.type,Number(p.value)]));
  const isoDate=date=>[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
  function jalaliMonthStart(jy,jm){
    const offset=jm<=6?(jm-1)*31:186+(jm-7)*30;
    const base=new Date(jy+621,2,20+offset,12);
    for(let delta=-8;delta<=8;delta++){
      const d=new Date(base.getFullYear(),base.getMonth(),base.getDate()+delta,12);
      const p=jalaliParts(d);
      if(p.year===jy&&p.month===jm&&p.day===1)return d;
    }
    for(let delta=-40;delta<=40;delta++){
      const d=new Date(base.getFullYear(),base.getMonth(),base.getDate()+delta,12);
      const p=jalaliParts(d);
      if(p.year===jy&&p.month===jm&&p.day===1)return d;
    }
    return base;
  }
  function pickerMarkup(picker){
    const jy=Number(picker.dataset.jy),jm=Number(picker.dataset.jm),selected=picker.dataset.selected||'';
    const start=jalaliMonthStart(jy,jm),offset=(start.getDay()+1)%7;
    const today=todayISO();
    const years=Array.from({length:21},(_,i)=>jy-10+i);
    const head='<div class="jalali-picker-head"><button type="button" class="jalali-nav" data-jalali-prev aria-label="ماه قبل">‹</button><select data-jalali-month aria-label="ماه">'+jalaliMonths.map((m,i)=>'<option value="'+(i+1)+'" '+(jm===i+1?'selected':'')+'>'+m+'</option>').join('')+'</select><select data-jalali-year aria-label="سال">'+years.map(y=>'<option value="'+y+'" '+(jy===y?'selected':'')+'>'+fa(y)+'</option>').join('')+'</select><button type="button" class="jalali-nav" data-jalali-next aria-label="ماه بعد">›</button></div>';
    let days='';
    for(let i=0;i<42;i++){
      const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i-offset,12),p=jalaliParts(d);
      if(p.year!==jy||p.month!==jm){days+='<button type="button" class="jalali-day" disabled></button>';continue;}
      const iso=isoDate(d),cls='jalali-day'+(iso===today?' is-today':'')+(iso===selected?' is-selected':'');
      days+='<button type="button" class="'+cls+'" data-jalali-date="'+iso+'">'+fa(p.day)+'</button>';
    }
    picker.innerHTML=head+'<div class="jalali-week">'+jalaliWeek.map(x=>'<span>'+x+'</span>').join('')+'</div><div class="jalali-days">'+days+'</div><div class="jalali-picker-foot"><button type="button" data-jalali-today>امروز</button><button type="button" data-jalali-close>بستن</button></div>';
  }
  function setPickerMonth(picker,jy,jm){
    while(jm<1){jm+=12;jy--;}while(jm>12){jm-=12;jy++;}
    picker.dataset.jy=jy;picker.dataset.jm=jm;pickerMarkup(picker);
  }

  const TYPES = { school:['مدرسه','peach'], maz:['ماز','blue'], ghalamchi:['قلمچی','green'], other:['سایر','blue'] };
  const ART = {grades:'../عکس ها/پروفایل نمرات.png',trophy:'../عکس ها/پروفایل جام.png',notes:'../عکس ها/پروفایل یادداشت.png',calendar:'../عکس ها/پروفایل تقویم.png'};
  const LOGO = {maz:'../عکس ها/ماز.png',school:'../عکس ها/مدرسه.png',ghalamchi:'../عکس ها/ماز.png',other:''};
  const ic = id => '<svg class="icon" aria-hidden="true"><use href="#'+id+'"/></svg>';
  const art = (key,label) => '<div class="art art-sm" data-label="'+label+'"><img src="'+ART[key]+'" alt="" onerror="this.parentNode.classList.add(\'is-empty\')"></div>';
  const head = (title,extra) => '<div class="sh"><h2>'+title+'</h2>'+(extra||'')+'</div>';
  const addButton = type => '<button class="add" type="button" data-add="'+type+'">'+ic('i-plus')+'افزودن سابقه</button>';
  const more = t => '<span class="tag">'+t+'</span>';
  const empty = text => '<div class="emp">'+text+'</div>';
  const emptyHistory = () => ({grades:[],tests:[],notes:[],performance:[],solved:[],exams:[]});
  let history = emptyHistory(), activeType = '';
  let saving = false;

  function setStatus(message,error=false){status.textContent=message||'';status.style.color=error?'var(--red)':'var(--muted)';}
  async function request(method='GET',body){
    const response=await fetch(API.academicHistory,{method,headers:{...(Auth.headers()||{}),...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),cache:'no-store'});
    const data=await response.json().catch(()=>({}));
    if(!response.ok||!data.ok)throw new Error(data.message||'ارتباط با سرور برقرار نشد.');
    return data.history;
  }
  async function persist(){
    if(saving)throw new Error('ذخیره قبلی هنوز تمام نشده است.');
    saving=true;setStatus('در حال ذخیره سوابق در حساب کاربری…');
    try{const payload={grades:history.grades||[],tests:history.tests||[],notes:history.notes||[],performance:history.performance||[],solved:history.solved||[],exams:history.exams||[]};history=await request('PUT',payload);setStatus('سوابق تحصیلی با موفقیت ذخیره شد.');}
    finally{saving=false;}
  }
  function chart(){
    const tests=[...history.tests].filter(t=>Number.isFinite(t.totalScore)||Number.isFinite(t.regionScore)).sort((a,b)=>a.date.localeCompare(b.date)).slice(-6);
    if(!tests.length)return empty('هنوز تراز آزمونی ثبت نکرده‌ای.');
    const vals=tests.flatMap(t=>[t.totalScore,t.regionScore]).filter(Number.isFinite);
    const min=Math.min(600,...vals),max=Math.max(900,...vals),range=Math.max(100,max-min);
    const low=Math.floor((min-30)/100)*100,high=Math.ceil((max+30)/100)*100;
    const L=42,R=548,T=12,B=142,n=tests.length;
    const X=i=>n===1?(L+R)/2:L+24+i*(R-L-48)/(n-1);
    const Y=v=>B-(v-low)/(high-low)*(B-T);
    let grid='';
    for(let v=low;v<=high;v+=Math.max(100,Math.ceil((high-low)/3/100)*100))grid+='<line class="g" x1="'+L+'" x2="'+R+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="t" x="'+(L-8)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+fa(v)+'</text>';
    tests.forEach((t,i)=>grid+='<text class="t" x="'+X(i)+'" y="'+(B+16)+'" text-anchor="middle">'+esc(dateFa(t.date).replace(/۱۴۰\d/g,''))+'</text>');
    const line=(key,color,dy)=>{const pts=tests.map((t,i)=>Number.isFinite(t[key])?X(i)+','+Y(t[key]):null).filter(Boolean);if(!pts.length)return '';return '<polyline fill="none" style="stroke:'+color+'" stroke-width="1.8" points="'+pts.join(' ')+'"/>'+tests.map((t,i)=>Number.isFinite(t[key])?'<circle cx="'+X(i)+'" cy="'+Y(t[key])+'" r="3" style="fill:'+color+'"/><text class="t" style="fill:'+color+'" x="'+X(i)+'" y="'+(Y(t[key])+dy)+'" text-anchor="middle">'+fa(t[key])+'</text>':'').join('');};
    return '<svg class="chart" viewBox="0 0 560 164" role="img" aria-label="نمودار تراز آزمون‌ها">'+grid+line('regionScore','var(--blue-ink)',14)+line('totalScore','var(--gold)',-8)+'</svg>';
  }
  function render(){
    const grades=history.grades||[],tests=[...(history.tests||[])].sort((a,b)=>a.date.localeCompare(b.date)),notes=[...(history.notes||[])].sort((a,b)=>b.date.localeCompare(a.date));
    const perf=history.performance||[],solved=history.solved||[],exams=[...(history.exams||[])].sort((a,b)=>a.date.localeCompare(b.date));
    const avg=grades.length?(grades.reduce((sum,g)=>sum+g.score,0)/grades.length).toFixed(1):'—';
    $('avgGoal').textContent='میانگین نمرات: '+fa(avg);
    const last=tests.length?tests[tests.length-1]:null;
    const totalValues=tests.map(t=>t.totalScore).filter(Number.isFinite);
    const avgT=totalValues.length?Math.round(totalValues.reduce((x,y)=>x+y,0)/totalValues.length):'—';
    app.innerHTML=`
    <section class="card" aria-label="نمرات امتحانات">
      ${head('نمرات امتحانات',more('میانگین '+fa(avg)))}
      <div class="split"><div class="gl" id="gl" aria-live="polite">
        <div class="gr hd"><span>نام درس</span><span>نوع آزمون</span><span>نمره</span><span></span></div>
        ${grades.length?grades.map(g=>'<div class="gr"><span class="nm">'+esc(g.subject)+'</span><span class="chip '+TYPES[g.source][1]+'">'+TYPES[g.source][0]+'</span><span class="sc">'+fa(g.score)+'</span><span class="ac"><button class="ib del" type="button" data-del="grades" data-id="'+esc(g.id)+'" aria-label="حذف">'+ic('i-x')+'</button></span></div>').join(''):empty('هنوز نمره‌ای ثبت نکرده‌ای.')}
        ${addButton('grades')}
      </div>${art('grades','تصویر نمرات')}</div>
    </section>
    <section class="card" aria-label="تراز آزمون‌های جامع">
      ${head('تراز آزمون‌های جامع',more('آخرین '+fa(tests.length)+' آزمون'))}
      <div class="lv"><div class="stats">
        <div class="stat"><small>آخرین تراز کل</small><b style="color:var(--gold)">${last&&last.totalScore!=null?fa(last.totalScore):'—'}</b></div>
        <div class="stat"><small>میانگین تراز کل</small><b>${fa(avgT)}</b></div>
      </div><div><div class="legend"><span><i style="background:var(--gold)"></i>تراز کل</span><span><i style="background:var(--blue-ink)"></i>تراز ناحیه</span></div>${chart()}${addButton('tests')}</div>${art('trophy','تصویر جام')}</div>
      <div class="ul" style="margin-top:12px">${tests.length?[...tests].reverse().map(t=>'<div class="ei"><span>'+esc(t.title)+' · '+dateFa(t.date)+'</span><span class="pill">'+(t.totalScore!=null?fa(t.totalScore):'بدون تراز')+'</span><button class="ib del" type="button" data-del="tests" data-id="'+esc(t.id)+'" aria-label="حذف">'+ic('i-x')+'</button></div>').join(''):empty('هنوز نتیجه آزمونی ثبت نشده است.')}</div>
    </section>
    <section class="card" aria-label="وضعیت روزانه">
      ${head('وضعیت روزانه و دیلی تسک')}
      <div class="nt"><div class="nl" id="noteList">${notes.length?notes.map(n=>'<div class="ni"><i class="d"></i><time>'+dateFa(n.date)+'</time><span class="chip '+n.color+'">'+esc(n.subject)+'</span><p>'+esc(n.text)+'</p><button class="ib del" type="button" data-del="notes" data-id="'+esc(n.id)+'" aria-label="حذف">'+ic('i-x')+'</button></div>').join(''):empty('هنوز یادداشت روزانه‌ای ثبت نکرده‌ای.')}</div>
      <div class="cp"><textarea id="noteText" placeholder="امروز چه اتفاقی در درس‌ها افتاده است؟" aria-label="یادداشت روزانه"></textarea><button class="send" id="sendNote" type="button" aria-label="ثبت یادداشت">${ic('i-send')}</button></div>${art('notes','تصویر یادداشت')}</div>
    </section>
    <section class="card" aria-label="عملکرد هر درس">
      ${head('عملکرد هر درس')}
      <div class="g4">${perf.length?perf.map(p=>'<div class="tile"><div class="r">'+esc(p.subject)+'<span>تسلط '+fa(p.mastery)+'٪</span></div><div class="bar"><i style="width:'+p.mastery+'%"></i></div><button class="ib del" type="button" data-del="performance" data-id="'+esc(p.id)+'" aria-label="حذف">'+ic('i-x')+'</button></div>').join(''):empty('هنوز عملکرد درسی ثبت نشده است.')}</div>${addButton('performance')}
    </section>
    <section class="card" aria-label="سوالات حل شده">
      ${head('نمونه سوالات و تست‌های حل شده')}
      <div class="g4">${solved.length?solved.map(item=>'<div class="tile sv"><span class="ic">'+ic('i-book')+'</span><div><small>'+esc(item.label)+'</small><b>'+fa(item.count)+'</b></div><button class="ib del" type="button" data-del="solved" data-id="'+esc(item.id)+'" aria-label="حذف">'+ic('i-x')+'</button></div>').join(''):empty('هنوز تعداد سوالات حل‌شده را وارد نکرده‌ای.')}</div>${addButton('solved')}
    </section>
    <section class="card" aria-label="آزمون‌های پیش رو">
      ${head('آزمون‌های پیش رو')}
      <div class="split"><div class="ul">${exams.length?exams.map(item=>'<div class="ei"><span class="ph lg" data-ph="لوگو">'+(LOGO[item.provider]?'<img src="'+LOGO[item.provider]+'" alt="" onerror="this.remove()">':'')+'</span><span>'+esc(item.title)+'</span><span class="pill">'+dateFa(item.date)+'</span><button class="ib del" type="button" data-del="exams" data-id="'+esc(item.id)+'" aria-label="حذف">'+ic('i-x')+'</button></div>').join(''):empty('هنوز آزمون آینده‌ای ثبت نکرده‌ای.')}</div>${art('calendar','تصویر تقویم')}</div>${addButton('exams')}
    </section>`;
  }
  const definitions={
    grades:{title:'افزودن نمره',fields:[['subject','نام درس','text',true],['source','نوع آزمون','select',true,[['school','مدرسه'],['maz','ماز'],['ghalamchi','قلمچی']]],['score','نمره از ۱۰۰','number',true,0,100],['date','تاریخ (اختیاری)','date',false]]},
    tests:{title:'ثبت نتیجه آزمون',fields:[['title','عنوان آزمون','text',true],['provider','برگزارکننده','select',true,[['maz','ماز'],['ghalamchi','قلمچی'],['school','مدرسه'],['other','سایر']]],['date','تاریخ آزمون','date',true],['totalScore','تراز کل','number',false,0,10000],['regionScore','تراز ناحیه','number',false,0,10000]]},
    notes:{title:'ثبت یادداشت روزانه',fields:[['subject','درس / موضوع','text',true],['date','تاریخ','date',true],['color','رنگ یادداشت','select',true,[['blue','آبی'],['green','سبز'],['peach','طلایی']]],['text','متن یادداشت','textarea',true]]},
    performance:{title:'ثبت عملکرد یک درس',fields:[['subject','نام درس','text',true],['mastery','درصد تسلط','number',true,0,100]]},
    solved:{title:'ثبت تعداد سوالات حل‌شده',fields:[['label','عنوان دسته','text',true],['count','تعداد','number',true,0,10000000]]},
    exams:{title:'افزودن آزمون آینده',fields:[['title','عنوان آزمون','text',true],['date','تاریخ آزمون','date',true],['provider','برگزارکننده','select',true,[['maz','ماز'],['ghalamchi','قلمچی'],['school','مدرسه'],['other','سایر']]]]}
  };
  function openAdd(type,trigger){
    activeType=type;
    const def=definitions[type];
    const parent=trigger.closest('.card')||trigger.parentElement;
    const previous=parent.querySelector('.inline-history-editor');
    if(previous){previous.remove();trigger.hidden=false;}
    trigger.hidden=true;
    const editor=document.createElement('form');
    editor.id='historyForm';
    editor.className='inline-history-editor';
    editor.innerHTML='<div class="inline-editor-head"><strong>'+esc(def.title)+'</strong><button type="button" class="inline-cancel" data-cancel-editor>بستن</button></div><div class="inline-editor-fields">'+def.fields.map(([name,label,kind,required,opts,min,max])=>{
      let input='';
      if(kind==='select')input='<select name="'+name+'" '+(required?'required':'')+'>'+opts.map(([v,t])=>'<option value="'+v+'">'+t+'</option>').join('')+'</select>';
      else if(kind==='textarea')input='<textarea name="'+name+'" rows="2" maxlength="1500" '+(required?'required':'')+'></textarea>';
      else if(name==='date'){const today=todayISO();input='<div class="jalali-date"><input type="hidden" name="date" value="'+today+'"><button type="button" class="jalali-date-trigger" data-jalali-open>'+dateFa(today)+'</button><div class="jalali-picker" hidden></div></div>';}
       else input='<input name="'+name+'" type="'+kind+'" '+(min!==undefined?'min="'+min+'"':'')+' '+(max!==undefined?'max="'+max+'"':'')+' '+(kind==='number'?'step="any"':'')+' '+(required?'required':'')+'>';
      return '<label class="inline-field">'+label+input+'</label>';
    }).join('')+'</div><div class="inline-editor-actions"><button type="submit" class="inline-save">ذخیره سابقه</button><button type="button" class="inline-cancel" data-cancel-editor>انصراف</button></div>';
    parent.appendChild(editor);
    editor.querySelectorAll('input,select,textarea').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'&&el.tagName!=='TEXTAREA'){e.preventDefault();}}));
    editor.querySelector('input,select,textarea')?.focus();
  }
  app.addEventListener('click',async e=>{

    const openDate=e.target.closest('[data-jalali-open]');
    if(openDate){
      const wrap=openDate.closest('.jalali-date'),picker=wrap.querySelector('.jalali-picker'),value=wrap.querySelector('input[name="date"]').value||todayISO();
      const [y,m,d]=value.split('-').map(Number),parts=jalaliParts(new Date(y,m-1,d,12));
      picker.dataset.selected=value;setPickerMonth(picker,parts.year,parts.month);picker.hidden=false;return;
    }
    const day=e.target.closest('[data-jalali-date]');
    if(day){
      const picker=day.closest('.jalali-picker'),wrap=picker.closest('.jalali-date'),iso=day.dataset.jalaliDate;
      wrap.querySelector('input[name="date"]').value=iso;wrap.querySelector('[data-jalali-open]').textContent=dateFa(iso);picker.hidden=true;return;
    }
    const prev=e.target.closest('[data-jalali-prev]'),next=e.target.closest('[data-jalali-next]');
    if(prev||next){const picker=e.target.closest('.jalali-picker');setPickerMonth(picker,Number(picker.dataset.jy),Number(picker.dataset.jm)+(prev?-1:1));return;}
    const month=e.target.closest('[data-jalali-month]'),year=e.target.closest('[data-jalali-year]');
    if(month||year){const picker=e.target.closest('.jalali-picker');setPickerMonth(picker,Number(picker.dataset.jy)+(year?0:0),month?Number(month.value):Number(picker.dataset.jm));if(year)setPickerMonth(picker,Number(year.value),Number(picker.dataset.jm));return;}
    const todayBtn=e.target.closest('[data-jalali-today]');
    if(todayBtn){const picker=todayBtn.closest('.jalali-picker'),wrap=picker.closest('.jalali-date'),iso=todayISO();wrap.querySelector('input[name="date"]').value=iso;wrap.querySelector('[data-jalali-open]').textContent=dateFa(iso);picker.hidden=true;return;}
    if(e.target.closest('[data-jalali-close]')){e.target.closest('.jalali-picker').hidden=true;return;}

    const add=e.target.closest('[data-add]');if(add){openAdd(add.dataset.add,add);return;}
    const cancel=e.target.closest('[data-cancel-editor]');if(cancel){const editor=cancel.closest('.inline-history-editor');if(editor){const trigger=editor.parentElement.querySelector('[data-add]');editor.remove();if(trigger)trigger.hidden=false;}return;}
    const del=e.target.closest('[data-del]');if(del){
      const type=del.dataset.del,id=del.dataset.id;
      if(!confirm('این سابقه حذف شود؟'))return;
      history[type]=history[type].filter(item=>item.id!==id);
      try{await persist();render();}catch(err){setStatus(err.message,true);await load();}
      return;
    }
    if(e.target.closest('#sendNote')){
      const text=$('noteText').value.trim();if(!text)return;
      history.notes.unshift({id:crypto.randomUUID(),date:todayISO(),subject:'عمومی',color:'blue',text});
      try{await persist();render();}catch(err){setStatus(err.message,true);await load();}
    }
  });
  app.addEventListener('submit',async e=>{
    const target=e.target;
    if(!target.matches('#historyForm'))return;
    e.preventDefault();if(saving)return;
    const data=Object.fromEntries(new FormData(target).entries()),type=activeType;
    const item={id:crypto.randomUUID()};
    for(const [k,v] of Object.entries(data))item[k]=['score','totalScore','regionScore','mastery','count'].includes(k)?(v===''?null:Number(v)):v;
    if(type==='grades'&&!item.date)item.date='';
    if(type==='notes'&&!item.subject)item.subject='عمومی';
    history[type].push(item);
    try{await persist();render();}catch(err){history[type].pop();setStatus(err.message,true);}
  });
  async function load(){
    try{
      if(typeof API==='undefined'||!API.academicHistory||typeof Auth==='undefined')throw new Error('تنظیمات اتصال سرور بارگذاری نشد.');
      const user=await Auth.requireAuth('../لاگین و ثبت نام/لاگین.html');if(!user)return;
      if(user.role!=='student')throw new Error('این بخش فقط برای حساب دانش‌آموزی در دسترس است.');
      history=await request();history={...emptyHistory(),...history};render();setStatus('');
    }catch(error){setStatus(error.message||'دریافت سابقه تحصیلی ناموفق بود.',true);}
  }
  load();
})();
</script>

<script>
(function(){
  if(!document.documentElement.classList.contains('embedded'))return;
  const sendHeight=()=>{
    const height=Math.max(
      document.documentElement.scrollHeight,
      document.documentElement.offsetHeight,
      document.body.scrollHeight,
      document.body.offsetHeight
    );
    parent.postMessage({type:'madar-profile-height',height:Math.ceil(height)},location.origin);
  };
  if('ResizeObserver' in window){
    const observer=new ResizeObserver(sendHeight);
    observer.observe(document.documentElement);
    observer.observe(document.body);
  }
  if('MutationObserver' in window){
    new MutationObserver(sendHeight).observe(document.getElementById('app'),{childList:true,subtree:true,attributes:true});
  }
  window.addEventListener('load',sendHeight);
  window.addEventListener('resize',sendHeight);
  sendHeight();
  setTimeout(sendHeight,100);
  setTimeout(sendHeight,500);
})();
</script>
</body>
